services:
  neo4j:
    image: neo4j:5.14.0-community
    container_name: assistente-rag-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}

    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins