
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente da Apostila</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="chat-container">

    <header class="chat-header">
      <h1>Assistente da Apostila</h1>
      <p>Faça perguntas sobre o conteúdo do documento.</p>
    </header>

    <section id="mensagens" class="chat-messages">
      <div class="mensagem assistente">
        Olá! Sou seu assistente. Qual é a sua dúvida sobre a apostila?
      </div>
    </section>

    <form id="formulario">
      <input
        type="text"
        id="pergunta"
        placeholder="Digite sua pergunta..."
        autocomplete="off"
        required
      >

      <button type="submit">Enviar</button>
    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="script.js"></script>

</body>
</html>
